name: Build Millimore Desktop

# Builds the app on GitHub's runners (so you don't need a local toolchain),
# uploads installers as artifacts, AND publishes them to a Releases page with
# permanent, direct download links. macOS is built for BOTH Apple Silicon
# (arm64) and Intel (x64) so the app runs on every Mac.
on:
  push:
    branches:
      - claude/millimore-desktop-design-474kzm
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write # required to publish a GitHub Release

jobs:
  # Fast feedback: lint + compile the bundles on Linux.
  verify:
    name: Lint & build bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (electron-vite)
        run: npm run build

  # macOS — one build per architecture so it runs on Intel AND Apple Silicon.
  package-mac:
    name: Package macOS (${{ matrix.arch }})
    needs: verify
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64 # Apple Silicon: M1 / M2 / M3 / M4
          - x64 # Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch FFmpeg binary for ${{ matrix.arch }}
        # ffmpeg-static IS the Millimore Native Engine (capture → composite →
        # hardware encode → RTMP tee). The installer skips the download if the
        # binary already exists, so `npm ci` leaves the runner's (arm64) binary
        # in place. Delete it and re-run for the TARGET arch, then verify.
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          node node_modules/ffmpeg-static/install.js
          echo "Packaged FFmpeg arch:"
          file node_modules/ffmpeg-static/ffmpeg
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_platform: darwin
      - name: Build bundles
        run: npm run build
      - name: Package (.dmg + .zip)
        # Signs + notarizes when the Apple secrets are configured; otherwise
        # produces an ad-hoc-signed build (mac.identity=null skips electron-
        # builder's signing so the afterPack ad-hoc sign is the only one), so CI
        # still succeeds without Apple certs.
        shell: bash
        run: |
          ARGS="--mac --${{ matrix.arch }} --publish never"
          if [ -n "${APPLE_TEAM_ID}" ]; then
            ARGS="$ARGS -c.mac.notarize.teamId=${APPLE_TEAM_ID}"
          fi
          npx electron-builder $ARGS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Disable cert auto-discovery only when no cert is supplied, so unsigned
          # builds still succeed instead of erroring on a missing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: millimore-desktop-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 14

  # Windows (x64 — covers virtually all Windows PCs).
  package-win:
    name: Package Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build bundles
        run: npm run build
      - name: Package (.exe)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: millimore-desktop-windows
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 14

  # Publish every installer to a single rolling GitHub Release with permanent,
  # direct download links — much easier to find than Actions artifacts.
  release:
    name: Publish Release
    needs: [package-mac, package-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Millimore Desktop — latest build
          body: |
            Latest Millimore Desktop installers, built automatically from the
            `claude/millimore-desktop-design-474kzm` branch.

            | Your machine | Download |
            | --- | --- |
            | 🍎 Mac — Intel | `*-mac-x64*` (`.dmg`) |
            | 🍎 Mac — Apple Silicon (M1–M4) | `*-mac-arm64*` (`.dmg`) |
            | 🪟 Windows | `*-windows*` (`.exe`) |

            The app is **unsigned**. On macOS, right-click the app → Open → Open,
            or run `xattr -dr com.apple.quarantine "/Applications/Millimore Desktop.app"`.
            On Windows, click "More info → Run anyway".
          files: installers/**/*
          make_latest: true
