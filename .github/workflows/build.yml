name: Build Millimore Desktop

# Builds the app on GitHub's runners (so you don't need a local toolchain) and
# uploads downloadable installers for macOS and Windows.
on:
  push:
    branches:
      - claude/millimore-desktop-design-474kzm
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  # Fast feedback: lint + compile the bundles on Linux.
  verify:
    name: Lint & build bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (electron-vite)
        run: npm run build

  # Package downloadable installers per OS.
  package:
    name: Package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: millimore-desktop-mac
            glob: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            script: package:win
            artifact: millimore-desktop-windows
            glob: |
              release/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          # Build unsigned — no Apple/Windows code-signing certs required.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: warn
          retention-days: 14
